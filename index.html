<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f2338">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Recanto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: sidebar fixa à esquerda + área de cards em grade; vira barra superior no celular */
:root{
  --paper:#f8efed; --surface:#fdf8f7; --surface2:#f5e7e5; --line:#ecd6d3;
  --ink:#3b1e26; --muted:#8e6970; --soft:#bb9aa0;
  --rose:#dca5aa; --on-rose:#3a1520; --wine:#6f2338; --on-wine:#fbeef1;
  --clay:#a52f4f; --sky:#6a7fa8;
  --ok:#4f7a5a; --warn:#c0843e; --bad:#b8343c;
  --sky1:#fcf1ec; --sky2:#f4d5d3; --hill1:#ecd0d0; --hill2:#d9adb3; --hill3:#b07384; --hill4:#7d3c51; --tree:#4b1c2b; --roof:#8a2b42; --wall:#f2d8c9; --sun:#f3b9ab;
  --a1:#a52f4f; --a2:#4f7a5a; --a3:#5873a8; --a4:#c0843e; --a5:#8458a6; --a6:#2a8282;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1114; --surface:#24181c; --surface2:#2f2126; --line:#412c33;
  --ink:#f4e5e8; --muted:#b6979d; --soft:#76595f;
  --rose:#b9767f; --on-rose:#2a0d15; --wine:#5e1d30; --on-wine:#f8e6ea;
  --clay:#e0758f; --sky:#93a6cc; --ok:#86b08f; --warn:#d9a35c; --bad:#ec6f76;
  --sky1:#2a1d26; --sky2:#43262f; --hill1:#3e2a31; --hill2:#35222a; --hill3:#2b1b22; --hill4:#22141a; --tree:#12080c; --roof:#5e1d2d; --wall:#6e4c4b; --sun:#d98f8a;
  --a1:#e0758f; --a2:#86b08f; --a3:#93a6cc; --a4:#d9a35c; --a5:#b892d6; --a6:#6cc0bd; 
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1114; --surface:#24181c; --surface2:#2f2126; --line:#412c33;
  --ink:#f4e5e8; --muted:#b6979d; --soft:#76595f;
  --rose:#b9767f; --on-rose:#2a0d15; --wine:#5e1d30; --on-wine:#f8e6ea;
  --clay:#e0758f; --sky:#93a6cc; --ok:#86b08f; --warn:#d9a35c; --bad:#ec6f76;
  --sky1:#2a1d26; --sky2:#43262f; --hill1:#3e2a31; --hill2:#35222a; --hill3:#2b1b22; --hill4:#22141a; --tree:#12080c; --roof:#5e1d2d; --wall:#6e4c4b; --sun:#d98f8a;
  --a1:#e0758f; --a2:#86b08f; --a3:#93a6cc; --a4:#d9a35c; --a5:#b892d6; --a6:#6cc0bd; 
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:18px;min-height:100%;padding-block:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---------- sidebar ---------- */
.side{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:18px;height:calc(100vh - 36px);height:calc(100dvh - 36px)}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:-.01em}
.brand i{font-family:var(--f-display);font-style:italic;color:var(--clay);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{padding:0 10px 6px;color:var(--soft)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-family:var(--f-display);font-size:15.5px}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface2);color:var(--ink);font-style:italic}
.nav a .badge{margin-left:auto;background:var(--clay);color:var(--surface);font-family:var(--f-mono);font-size:10px;border-radius:99px;padding:1px 7px;font-style:normal}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.quote{background:var(--surface2);border-radius:12px;padding:12px;font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--muted)}
.theme-btn{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:13px}
.theme-btn:hover{background:var(--surface2);color:var(--ink)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.crumb{color:var(--soft)}
.crumb span{color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:italic;color:var(--clay)}
h1 small{font-size:.45em;font-style:italic;color:var(--muted);margin-left:8px;letter-spacing:0}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h2 svg{width:16px;height:16px;stroke:currentColor;opacity:.75}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-fin{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.dark:hover{opacity:.88}
.btn.sm{padding:3px 10px;font-size:11.5px}
.btn svg{width:13px;height:13px;stroke:currentColor}
.icon-btn{border:0;background:none;color:var(--soft);padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{color:var(--bad);background:var(--surface2)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:99px;padding:4px 12px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--wine);color:var(--on-wine)}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;border:1px solid currentColor;background:none;white-space:nowrap}
.chip.todo{color:var(--warn)} .chip.doing{color:var(--sky)} .chip.done{color:var(--ok)} .chip.late{color:var(--bad)}
.chip.ideia{color:var(--muted)} .chip.agendado{color:var(--sky)} .chip.publicado{color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:220px}
.hero-txt{padding:22px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center;z-index:1}
.hero-txt h1{font-size:clamp(30px,3.6vw,44px)}
.hero-txt h1 button{all:unset;cursor:pointer;font-style:italic;color:var(--clay);border-bottom:1px dashed transparent}
.hero-txt h1 button:hover{border-bottom-color:var(--clay)}
.hero-sum{color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.hero-art{position:relative;min-height:200px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art::before{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(90deg,var(--surface),transparent);z-index:1}

/* ---------- dashboard cards ---------- */
.card-rose{background:var(--rose);color:var(--on-rose);border-color:transparent}
.card-wine{background:var(--wine);color:var(--on-wine);border-color:transparent}
.card-rose .mono,.card-wine .mono{opacity:.72}
.big{font-family:var(--f-display);font-size:clamp(28px,3vw,36px);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-left:6px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.link-arrow{color:inherit;text-decoration:none;opacity:.75;font-family:var(--f-mono);font-size:11px}
.link-arrow:hover{opacity:1}
.foot-note{margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:12px;opacity:.85}

/* mini calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{color:var(--soft);font-family:var(--f-mono);font-size:10px;padding-bottom:2px}
.cal button{border:0;background:var(--surface2);border-radius:50%;aspect-ratio:1;max-width:100%;font-family:var(--f-mono);font-size:11px;position:relative;color:var(--ink);padding:0}
.cal button.out{background:none;color:var(--soft)}
.cal button.today{background:var(--clay);color:var(--surface);font-weight:700}
.cal button.sel{outline:2px solid var(--wine);outline-offset:1px}
.cal button .pip{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--rose)}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--f-display);font-size:14px}
.cal-nav button{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 8px;border-radius:6px}
.cal-nav button:hover{background:var(--surface2)}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:11.5px;color:var(--muted)}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--soft);background:none;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--wine);border-color:var(--wine)}
.check.on::after{content:"";width:8px;height:4px;border:solid var(--on-wine);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.empty{color:var(--soft);font-style:italic;font-family:var(--f-display);padding:10px 0;font-size:14px}

/* ---------- tarefas ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;min-width:0}
.day.is-today{border-color:var(--clay);box-shadow:0 0 0 1px var(--clay) inset}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-family:var(--f-display);font-weight:500;font-size:15px;text-transform:capitalize}
.slot{background:var(--surface2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:84px;transition:background .15s}
.slot.over{background:color-mix(in srgb,var(--rose) 22%,var(--surface2))}
.slot-h{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.slot-h button{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;border-radius:4px}
.slot-h button:hover{color:var(--ink);background:var(--surface)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.task:active{cursor:grabbing}
.task .top{display:flex;gap:8px;align-items:flex-start}
.task .top p{margin:0;flex:1;font-size:12.5px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.task.done .top p{text-decoration:line-through;color:var(--soft)}
.task .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:26px}
.task .proj{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.drop-hint{color:var(--soft);font-size:11.5px;text-align:center;font-style:italic;font-family:var(--f-display);margin:auto 0}

/* ---------- hábitos ---------- */
.htable{width:100%;border-collapse:collapse;min-width:560px}
.htable th{font-weight:400;text-align:center;padding:6px 4px;color:var(--soft)}
.htable th:first-child,.htable td:first-child{text-align:left}
.htable td{padding:10px 4px;border-top:1px solid var(--line);text-align:center}
.htable td:first-child{font-family:var(--f-display);font-size:16px}
.hcell{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);padding:0}
.hcell.on{background:var(--wine);border-color:var(--wine)}
.hcell.today{box-shadow:0 0 0 2px var(--clay)}
.streak{font-family:var(--f-mono);font-size:12px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--clay);border-radius:99px}
.bar.over i{background:var(--bad)}
.scroll-x{overflow-x:auto}

/* ---------- notas ---------- */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note.pinned{background:color-mix(in srgb,var(--rose) 12%,var(--surface))}
.note h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:16px;overflow-wrap:anywhere}
.note p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10px;color:var(--clay);background:color-mix(in srgb,var(--clay) 12%,transparent);border-radius:5px;padding:2px 6px;border:0}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 10px;min-width:0}
.sync .dot{width:8px;height:8px}
.sync button{border:0;background:none;color:var(--clay);text-decoration:underline;padding:0;font-size:12px}
@media (max-width:900px){.sync span.txt{display:none}.sync{padding:0}}
.tag[aria-pressed="true"]{background:var(--wine);color:var(--on-wine)}
.note-f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;color:var(--soft);font-size:11px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;min-width:0;width:260px;max-width:100%}

/* ---------- agenda ---------- */
.bigcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bigcal .dw{font-family:var(--f-mono);font-size:10px;color:var(--soft);text-transform:uppercase;padding:0 4px}
.bigcal button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:86px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch;min-width:0;overflow:hidden}
.bigcal button.out{opacity:.45}
.bigcal button.today .n{background:var(--clay);color:var(--surface);border-radius:99px;padding:0 6px;align-self:flex-start}
.bigcal button.sel{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine) inset}
.bigcal .n{font-family:var(--f-mono);font-size:11px}
.bigcal .ev{font-size:10.5px;background:color-mix(in srgb,var(--rose) 22%,transparent);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigcal .tk{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.g-ag{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{min-height:100px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.field textarea#f_caption{min-height:140px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3>.cal-card{grid-column:span 2}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding-top:0;gap:14px}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;border-radius:0 0 16px 16px;border-top:0;padding:10px 12px;gap:10px;margin-left:calc(-1 * max(18px,env(safe-area-inset-left,0px)) + 8px);margin-right:calc(-1 * max(18px,env(safe-area-inset-right,0px)) + 8px)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .brand b{font-size:18px}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;flex:1;min-width:0;scrollbar-width:none}
  .nav .lbl,.side-foot .quote{display:none}
  .nav a{padding:6px 10px;font-size:14px;white-space:nowrap}
  .nav a .badge{margin-left:4px}
  .side-foot{margin:0}
  .theme-btn span{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{min-height:150px;order:-1}
  .hero-art::before{inset:auto 0 0 0;width:auto;height:45%;background:linear-gradient(0deg,var(--surface),transparent)}
  .g-fin,.g-ag{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .g3{grid-template-columns:minmax(0,1fr)}
  .g3>.cal-card{grid-column:auto}
  .brand b{display:none}
  .bigcal button{min-height:58px;padding:4px}
  .bigcal .ev{display:none}
  .frow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0;padding-top:2px}
.news a{color:inherit;text-decoration:none;font-family:var(--f-display);font-size:17px;line-height:1.3;text-wrap:pretty}
.news a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.news span{font-size:11.5px;color:var(--muted)}
.nmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.news .saved{color:var(--ok);font-size:11.5px}
.btn.idea{border-color:var(--clay);color:var(--clay)}
.row .t span a{color:var(--clay)}
.news.compact li{border-color:color-mix(in srgb,currentColor 18%,transparent);padding:8px 0}
.news.compact a{font-size:15px}
.news.compact span{color:inherit;opacity:.7}
.topics{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.topics button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.topics button[aria-selected="true"]{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.legend{display:flex;gap:12px;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
#daypanel{scroll-margin-top:96px}
.ccell.sel{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine) inset}
.accbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--muted)}
.acc .dot{background:var(--c)}
.acc.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ctstats{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;gap:22px}
.ccal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ccal .dw{font-family:var(--f-mono);font-size:10px;color:var(--soft);text-transform:uppercase;padding:0 4px}
.ccell{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;cursor:pointer;transition:background .15s}
.ccell:hover{background:var(--surface2)}
.ccell.out{opacity:.45}
.ccell.over{background:color-mix(in srgb,var(--rose) 30%,var(--surface))}
.ccell .n{font-family:var(--f-mono);font-size:11px;padding:0 2px}
.ccell.today .n{background:var(--clay);color:var(--surface);border-radius:99px;padding:0 6px;align-self:flex-start}
.ccell .more{font-family:var(--f-mono);font-size:10px;color:var(--muted);padding:0 4px}
.pchip{all:unset;box-sizing:border-box;display:block;font-size:10.5px;line-height:1.3;padding:2px 5px 2px 6px;border-radius:5px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.pchip b{font-weight:400;margin-right:3px;color:var(--c)}
.pchip.st-publicado{opacity:.6}
.pchip:focus-visible{outline:2px solid var(--clay)}
.prow{cursor:pointer;border-radius:8px}
.prow:hover{background:var(--surface2)}
.chip.st{color:var(--muted)}
.chip.roteiro{color:var(--a5)} .chip.produzindo{color:var(--warn)}
@media (max-width:620px){.ccell{min-height:62px;padding:3px}.pchip{font-size:0;padding:0;height:6px;border-left:0;background:var(--c);border-radius:3px}.pchip b{display:none}.ccell .more{font-size:9px}}

.gc-p{margin:0 0 10px;color:var(--muted);font-size:13px}
.help{color:var(--muted);font-size:12px;line-height:1.5}
.gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:grid;place-items:center;padding:16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}

/* Junta as mudanças deste aparelho com as que chegaram de outro (por item, usando o id). */
function merge3(base,local,remote){
  const J=JSON.stringify;
  const out=JSON.parse(J(remote));
  const keys=new Set([...Object.keys(local||{}),...Object.keys(remote||{})]);
  for(const k of keys){
    const b=base?.[k],l=local?.[k],r=remote?.[k];
    const isList=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&'id' in x);
    if(isList(l)&&isList(r)&&(b===undefined||isList(b))){
      const B=new Map((b||[]).map(x=>[x.id,x])),L=new Map(l.map(x=>[x.id,x])),R=new Map(r.map(x=>[x.id,x]));
      const res=[];
      for(const x of r){
        if(B.has(x.id)&&!L.has(x.id)){if(J(B.get(x.id))!==J(x))res.push(x);continue} // apagado aqui; mantém se o outro editou
        const li=L.get(x.id);
        res.push(li&&J(li)!==J(B.get(x.id))?li:x);
      }
      for(const x of l){if(R.has(x.id))continue;if(!B.has(x.id)||J(B.get(x.id))!==J(x))res.push(x)} // novo aqui, ou editado aqui e apagado lá
      out[k]=res;
    }else if(J(l)!==J(b)){out[k]=l}
  }
  return out;
}
const cloud={uid:null,ready:false,busy:false,dirty:false,timer:null,versao:0,base:null,chan:null,lastPull:0,
  status(kind,msg,btn){
    const color={ok:'var(--ok)',busy:'var(--warn)',off:'var(--soft)',err:'var(--bad)'}[kind];
    const el=$('#sync');el.innerHTML=`<i class="dot" style="background:${color}"></i><span class="txt"></span>`;
    el.querySelector('.txt').textContent=msg;el.title=msg;
    if(btn){const b=document.createElement('button');b.type='button';b.textContent=btn.label;b.onclick=btn.fn;el.appendChild(b)}
    const out=document.createElement('button');out.type='button';out.textContent='Sair';out.onclick=()=>sb.auth.signOut();el.appendChild(out);
  },
  okMsg(){const d=new Date();this.status('ok','Sincronizado às '+pad(d.getHours())+':'+pad(d.getMinutes()))},
  cache(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},
  apply(dados,versao){
    // chegou versão nova de outro aparelho
    if(this.dirty||this.busy){this.pendingRemote={dados,versao};return}
    this.versao=versao;this.base=JSON.stringify(dados);S=JSON.parse(this.base);this.cache();
    if(!$('#ov'))render();this.okMsg();
  },
  async fetchRow(){
    const {data,error}=await sb.from('recanto_dados').select('dados,versao').eq('user_id',this.uid).maybeSingle();
    if(error)throw error;return data;
  },
  async load(){
    this.status('busy','Carregando da nuvem…');
    try{
      const r1=await sb.rpc('recanto_reivindicar');if(r1.error)throw r1.error;
      let data=await this.fetchRow();
      if(!data){const ins=await sb.from('recanto_dados').insert({id:this.uid,user_id:this.uid,dados:S}).select('dados,versao').single();if(ins.error)throw ins.error;data=ins.data}
      this.ready=true;this.lastPull=Date.now();
      if(data.dados&&data.dados.tasks){this.versao=data.versao;this.base=JSON.stringify(data.dados);S=JSON.parse(this.base);this.cache();render();this.okMsg()}
      else{this.versao=data.versao;this.base=JSON.stringify(data.dados||{});this.dirty=true;this.flush()}
      this.listen();
    }catch(e){this.status('err','Não deu para carregar da nuvem.',{label:'Tentar de novo',fn:()=>this.load()})}
  },
  listen(){
    if(this.chan)sb.removeChannel(this.chan);
    this.chan=sb.channel('recanto-'+this.uid).on('postgres_changes',{event:'UPDATE',schema:'public',table:'recanto_dados',filter:'user_id=eq.'+this.uid},pl=>{
      const n=pl.new||{};if(!(n.versao>this.versao))return;
      if(n.dados&&n.dados.tasks)this.apply(n.dados,n.versao);else this.pull(true);
    }).subscribe();
  },
  async pull(force){
    if(!this.ready||!this.uid)return;
    if(!force&&Date.now()-this.lastPull<4000)return;
    this.lastPull=Date.now();
    try{const data=await this.fetchRow();if(data&&data.versao>this.versao)this.apply(data.dados,data.versao)}catch(e){}
  },
  schedule(){if(!this.ready)return;this.dirty=true;clearTimeout(this.timer);this.status('busy','Alterações por salvar…');this.timer=setTimeout(()=>{this.timer=null;this.flush()},900)},
  async flush(tries=0){
    if(!this.ready||this.busy||!this.dirty)return;
    this.busy=true;this.dirty=false;this.status('busy','Salvando…');
    let failed=false;
    try{
      if(this.pendingRemote){const pr=this.pendingRemote;this.pendingRemote=null;S=merge3(JSON.parse(this.base),S,pr.dados);this.base=JSON.stringify(pr.dados);this.versao=pr.versao}
      const sent=JSON.stringify(S);
      const {data,error}=await sb.from('recanto_dados').update({dados:JSON.parse(sent)}).eq('user_id',this.uid).eq('versao',this.versao).select('versao');
      if(error)throw error;
      if(data&&data.length){this.versao=data[0].versao;this.base=sent;this.cache();this.okMsg()}
      else{ // outro aparelho salvou antes: junta e tenta de novo
        const row=await this.fetchRow();
        S=merge3(JSON.parse(this.base),S,row.dados);this.base=JSON.stringify(row.dados);this.versao=row.versao;
        this.dirty=true;if(!$('#ov'))render();
        if(tries>3)throw new Error('conflito');
        this.busy=false;return this.flush(tries+1);
      }
    }catch(e){failed=true;this.dirty=true;this.status('err','Não salvou. Verifique a internet.',{label:'Tentar de novo',fn:()=>this.flush()})}
    this.busy=false;
    if(!failed&&this.pendingRemote&&!this.dirty){const pr=this.pendingRemote;this.pendingRemote=null;if(pr.versao>this.versao)this.apply(pr.dados,pr.versao)}
    if(!failed&&this.dirty&&!this.timer)this.flush();
  }
};

async function authSubmit(mode){

  if(!email||pw.length<6){$('#gateMsg').textContent='Informe o e-mail e uma senha com pelo menos 6 caracteres.';return}

  const r=mode==='up'?await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password:pw});
  if(r.error){
    const m=r.error.message||'';
    $('#gateMsg').textContent=/invalid login/i.test(m)?'E-mail ou senha incorretos.':/not confirmed/i.test(m)?'Confirme seu e-mail pelo link que enviamos e depois entre.':/already registered/i.test(m)?'Este e-mail já tem conta. Use Entrar.':/signups not allowed/i.test(m)?'Novas contas estão desativadas.':'Não deu certo: '+m;

function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function form(title,fields,onSubmit,submitLabel='Salvar',extras=[]){
  const L=$('#layer');
  const f=fields.map(x=>{
    const id='f_'+x.id;const v=x.value??'';
    let inp;
    if(x.type==='select')inp=`<select id="${id}" name="${x.id}">${x.options.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(x.type==='textarea')inp=`<textarea id="${id}" name="${x.id}">${esc(v)}</textarea>`;
    else inp=`<input id="${id}" name="${x.id}" type="${x.type||'text'}" value="${esc(v)}" ${x.type==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${x.required?'required':''} ${x.placeholder?`placeholder="${esc(x.placeholder)}"`:''}>`;
    return `<div class="field" ${x.half?'data-half':''}><label class="mono" for="${id}">${esc(x.label)}</label>${inp}${x.help?`<small class="help">${x.help}</small>`:''}</div>`;
  });
  // agrupa campos "half" em pares
  let html='',buf=[];
  fields.forEach((x,i)=>{if(x.half){buf.push(f[i]);if(buf.length===2){html+=`<div class="frow">${buf.join('')}</div>`;buf=[]}}else{if(buf.length){html+=`<div class="frow">${buf.join('')}</div>`;buf=[]}html+=f[i]}});
  if(buf.length)html+=`<div class="frow">${buf.join('')}</div>`;
  L.innerHTML=`<div class="overlay" id="ov"><form class="modal" id="mf" novalidate><h2>${esc(title)}</h2>${html}<div class="modal-actions">${extras.map((x,i)=>`<button type="button" class="btn ${x.cls||''}" data-extra="${i}">${esc(x.label)}</button>`).join('')}<span style="flex:1"></span><button type="button" class="btn" id="mcancel">Cancelar</button><button class="btn dark" type="submit">${esc(submitLabel)}</button></div></form></div>`;
  const close=()=>{L.innerHTML='';document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',onKey);
  $('#mcancel').onclick=close;
  L.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{const vals={};fields.forEach(x=>{vals[x.id]=$('#f_'+x.id).value.trim()});extras[+b.dataset.extra].fn({btn:b,close,values:vals})});
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close()});
  $('#mf').onsubmit=e=>{
    e.preventDefault();
    const data={};fields.forEach(x=>{data[x.id]=$('#f_'+x.id).value.trim()});
    const miss=fields.find(x=>x.required&&!data[x.id]);
    if(miss){$('#f_'+miss.id).focus();$('#f_'+miss.id).style.borderColor='var(--bad)';return}
    close();onSubmit(data);save();render();
  };
  setTimeout(()=>{const first=L.querySelector('input,textarea,select');first&&first.focus()},30);
}

function landscape(){
  const W=640,H=240;
  const hill=(base,amps,ph)=>{let p=`M0 ${H}`;for(let x=0;x<=W;x+=8){let y=base;amps.forEach(([a,f],i)=>y+=a*Math.sin(x*f+ph*(i+1)));p+=` L${x} ${y.toFixed(1)}`}return p+` L${W} ${H} Z`};
  const yAt=(base,amps,ph,x)=>{let y=base;amps.forEach(([a,f],i)=>y+=a*Math.sin(x*f+ph*(i+1)));return y};
  const arau=(x,y,s)=>{ // pinheiro araucária estilizado
    let g=`<path d="M${x} ${y} L${x} ${y-62*s}" stroke="var(--tree)" stroke-width="${1.6*s}" fill="none"/>`;
    const tiers=[[-62,24],[-55,27],[-47,23],[-40,16],[-34,9]];
    tiers.forEach(([dy,w])=>{const ty=y+dy*s,ww=w*s;
      g+=`<path d="M${x} ${ty+4*s} Q${x-ww*.55} ${ty+3*s} ${x-ww} ${ty-5*s} M${x} ${ty+4*s} Q${x+ww*.55} ${ty+3*s} ${x+ww} ${ty-5*s}" stroke="var(--tree)" stroke-width="${1.2*s}" fill="none"/>`;
      g+=`<ellipse cx="${x-ww}" cy="${ty-6*s}" rx="${5*s}" ry="${2.6*s}" fill="var(--tree)"/><ellipse cx="${x+ww}" cy="${ty-6*s}" rx="${5*s}" ry="${2.6*s}" fill="var(--tree)"/>`});
    return g};
  const h2=[160,[[10,.012],[6,.031]],1.2], h3=[182,[[8,.009],[5,.024]],2.4];
  let trees='';
  [[380,.9],[440,1.25],[470,.8],[560,1.05],[600,.7],[300,.6],[250,.5]].forEach(([x,s])=>{trees+=arau(x,yAt(...h2.slice(0,2),h2[2],x)+2,s)});
  // fileiras de plantação
  let rows='';for(let i=0;i<9;i++){const y0=196+i*6;rows+=`<path d="M${120+i*12} ${H} Q${330} ${y0-14} ${W} ${y0+4}" stroke="var(--hill3)" stroke-width="2" fill="none" opacity=".55"/>`}
  const hx=470,hy=yAt(...h3.slice(0,2),h3[2],hx)+6;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#sk)"/>
    <circle cx="520" cy="62" r="26" fill="var(--sun)" opacity=".85"/>
    <path d="M300 48q5-4 10 0q5-4 10 0M335 36q4-3 8 0q4-3 8 0" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
    <path d="${hill(128,[[14,.008],[7,.02]],.3)}" fill="var(--hill1)"/>
    <path d="${hill(...h2.slice(0,2),h2[2])}" fill="var(--hill2)"/>
    ${trees}
    <path d="${hill(...h3.slice(0,2),h3[2])}" fill="var(--hill3)"/>
    <path d="${hill(214,[[6,.006],[3,.02]],3.1)}" fill="var(--hill4)"/>
    ${rows}
    <g transform="translate(${hx} ${hy-22})"><rect x="0" y="8" width="34" height="18" fill="var(--wall)"/><path d="M-4 9 L17 -4 L38 9z" fill="var(--roof)"/><rect x="13" y="15" width="7" height="11" fill="var(--roof)"/><path d="M27 -1 v-8" stroke="var(--roof)" stroke-width="3"/><path d="M28 -12 q4 -6 0 -12 q-4 -6 2 -12" stroke="var(--soft)" stroke-width="1.4" fill="none" opacity=".7"/></g>
  </svg>`;
}

/* ================= gráficos ================= */
function sparkline(vals,stroke){
  const w=300,h=70,n=vals.length;if(n<2)return '';
  const max=Math.max(...vals,1);const x=i=>4+i*(w-8)/(n-1),y=v=>h-6-(v/max)*(h-14);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;max-width:100%" aria-hidden="true">
    <path d="M${pts.join(' L')} L${x(n-1)},${h} L${x(0)},${h}Z" fill="currentColor" opacity=".12"/>
    <path d="M${pts.join(' L')}" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="3.5" fill="${stroke}"/></svg>`;
}

function miniCal(off){
  const base=new Date(TODAY.getFullYear(),TODAY.getMonth()+off,1);
  const start=addDays(base,-base.getDay());
  let h=DW1.map(x=>`<div class="dw">${x}</div>`).join('');
  for(let i=0;i<42;i++){const d=addDays(start,i);const k=iso(d);const has=allEvents().some(e=>e.date===k);
    if(i>=35&&d.getMonth()!==base.getMonth())break;

    <div class="grid" style="align-content:start">
      ${(()=>{const k=ui.ctSel;const ps=posts.filter(p=>p.date===k).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));const d=parse(k);
        return `<div class="panel" id="daypanel"><div class="panel-h"><h2>${k===T?'Hoje':DOW[d.getDay()]+', '+fmtDay(k)}</h2><button class="btn sm dark" data-act="pnewday" data-d="${k}">${ico('plus')} Post neste dia</button></div><div class="rows">${ps.map(row).join('')||'<div class="empty">Nenhum post neste dia.</div>'}</div></div>`})()}
      <div class="panel" data-pdrop=""><div class="panel-h"><h2>Ideias sem data</h2><span class="mono" style="color:var(--soft)">${undated.length}</span></div><div class="rows">${undated.map(row).join('')||'<div class="empty">Sem ideias soltas. Guarde notícias ou crie um post sem data.</div>'}</div></div>
      <div class="panel"><div class="panel-h"><h2>Próximos posts</h2></div><div class="rows">${upcoming.map(row).join('')||'<div class="empty">Nada agendado.</div>'}</div></div>
    </div>
  </div>
  <div class="panel"><div class="panel-h"><h2>${ico('news')}Ideias: nutrição esportiva</h2><span style="display:flex;gap:6px"><button class="btn sm" data-act="newsreload" data-v="nutricao">↻</button><a class="btn sm" href="#noticias" data-act="gonutri">Ver todas</a></span></div>${newsList(G.news.nutricao,6,{topic:'nutricao',idea:true})}</div>`;
};
function bindPostDrag(){
  document.querySelectorAll('[data-pdrag]').forEach(el=>el.addEventListener('dragstart',ev=>{ev.stopPropagation();ev.dataTransfer.setData('text/plain',el.dataset.pdrag);ev.dataTransfer.effectAllowed='move'}));
  document.querySelectorAll('[data-pdrop]').forEach(c=>{
    c.addEventListener('dragover',ev=>{ev.preventDefault();c.classList.add('over')});
    c.addEventListener('dragleave',()=>c.classList.remove('over'));
    c.addEventListener('drop',ev=>{ev.preventDefault();c.classList.remove('over');const p=find('posts',ev.dataTransfer.getData('text/plain'));if(!p)return;p.date=c.dataset.pdrop;save();render();toast(p.date?'Post movido para '+fmtDay(p.date):'Post voltou para ideias sem data')});
  });
}

/* ================= notícias e Google Agenda ================= */
const TOPICOS=[['destaques','Destaques'],['nutricao','Nutrição esportiva'],['brasil','Brasil'],['mundo','Mundo'],['economia','Economia'],['tecnologia','Tecnologia'],['ciencia','Ciência'],['saude','Saúde'],['esportes','Esportes'],['entretenimento','Entretenimento']];
const G={topic:'destaques',news:{},newsAt:{},newsErr:{},newsLoading:{},gcal:{conectado:null,eventos:[],erro:'',at:null,loading:false}};
try{const c=JSON.parse(localStorage.getItem('recanto.extras')||'null');if(c){G.news=c.news||{};G.newsAt=c.newsAt||{};if(c.gcal)G.gcal={...G.gcal,...c.gcal,loading:false}}}catch(e){}
const saveExtras=()=>{try{localStorage.setItem('recanto.extras',JSON.stringify({news:G.news,newsAt:G.newsAt,gcal:{conectado:G.gcal.conectado,eventos:G.gcal.eventos,at:G.gcal.at}}))}catch(e){}};
const allEvents=()=>[...S.events,...(G.gcal.eventos||[]).map(e=>({...e,google:true}))];
const rel=iso=>{if(!iso)return '';const m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return 'agora';if(m<60)return `há ${m} min`;const h=Math.round(m/60);if(h<24)return `há ${h} h`;const d=Math.round(h/24);return `há ${d} dia${d>1?'s':''}`};
const refreshIf=(...routes)=>{if(routes.includes(ui.route)&&!$('#ov'))render()};
async function loadNews(t,force){
  if(!sb||!cloud.uid)return;
  if(!force&&G.newsAt[t]&&Date.now()-new Date(G.newsAt[t])<10*60e3)return;
  G.newsLoading[t]=true;G.newsErr[t]='';refreshIf('inicio','noticias','conteudo');
  try{
    const {data,error}=await sb.functions.invoke('noticias',{body:{topico:t}});
    if(error||!data||data.erro)throw error||new Error(data?.erro||'sem dados');
    G.news[t]=data.itens;G.newsAt[t]=data.atualizado||new Date().toISOString();saveExtras();
  }catch(e){G.newsErr[t]='Não deu para carregar as notícias agora.'}
  G.newsLoading[t]=false;refreshIf('inicio','noticias','conteudo');
}
function newsList(items,max,o={}){
  const t=o.topic||(o.compact?'destaques':G.topic);
  if(!items||!items.length){
    if(G.newsErr[t])return `<div class="empty" style="color:inherit">${G.newsErr[t]} <button class="btn sm" data-act="newsreload" data-v="${t}">Tentar de novo</button></div>`;
    return `<div class="empty" style="color:inherit;opacity:.75">${G.newsLoading[t]||cloud.uid?'Carregando notícias…':'Entre para ver as notícias.'}</div>`;
  }
  const idea=n=>!o.idea?'':S.posts.some(p=>p.link===n.link)?`<span class="saved">✓ Já está nas ideias</span>`:`<button class="btn sm idea" data-act="toidea" data-t="${esc(n.titulo)}" data-l="${esc(n.link)}">${ico('plus')} Virar ideia de post</button>`;
  return `<ol class="news ${o.compact?'compact':''}">${items.slice(0,max).map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.titulo)}</a><div class="nmeta"><span>${esc(n.fonte||'')}${n.data?' · '+rel(n.data):''}</span>${idea(n)}</div></li>`).join('')}</ol>`;
}
V.noticias=()=>{
  const t=G.topic;
  return head('Notícias','Notícias','o que está acontecendo hoje',`<button class="btn" data-act="newsreload">↻ Atualizar</button>`)+
  `<div class="topics" role="tablist">${TOPICOS.map(([k,l])=>`<button role="tab" data-act="newstopic" data-v="${k}" aria-selected="${k===t}">${l}</button>`).join('')}</div>
  <div class="panel">${t==='nutricao'?'<p class="gc-p">Notícias das últimas 2 semanas sobre suplementação, proteína, dieta de atletas e hipertrofia. Toque em <b>Virar ideia de post</b> para guardar em Conteúdo.</p>':''}${newsList(G.news[t],25,{topic:t,idea:true})}<div class="foot-note" style="color:var(--muted)">Fonte: Google Notícias · ${G.newsAt[t]?'atualizado '+rel(G.newsAt[t]):''}${G.newsLoading[t]?' · atualizando…':''}</div></div>`;
};
async function loadGcal(){
  if(!sb||!cloud.uid)return;
  G.gcal.loading=true;refreshIf('agenda','inicio');
  try{
    const {data,error}=await sb.functions.invoke('agenda-google',{body:{}});
    if(error||!data)throw error||new Error('sem dados');
    G.gcal.conectado=!!data.conectado;G.gcal.eventos=data.eventos||[];
    G.gcal.erro=data.erro==='google'?'O Google recusou o endereço. Confira se copiou o "Endereço secreto no formato iCal".':data.erro==='nao_e_ical'?'Esse link não é um calendário iCal. Use o "Endereço secreto no formato iCal".':data.erro?'Não deu para ler a agenda agora.':'';
    if(!data.erro){G.gcal.at=data.atualizado;}
    saveExtras();
  }catch(e){G.gcal.erro='Não deu para falar com o servidor da agenda.'}
  G.gcal.loading=false;refreshIf('agenda','inicio');
}
function gcalPanel(){
  const g=G.gcal;
  const body=g.conectado?
    `<p class="gc-p">${g.eventos.length} evento${g.eventos.length===1?'':'s'} nos próximos meses aparecem no calendário em <span style="color:var(--sky)">azul</span>.${g.at?' Atualizado '+rel(g.at)+'.':''}</p>${g.erro?`<p class="gc-p" style="color:var(--bad)">${g.erro}</p>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="gsync">↻ Atualizar</button><button class="btn sm" data-act="gconnect">Trocar link</button><button class="btn sm" data-act="gdisconnect">Desconectar</button></div>`:
    `<p class="gc-p">Veja os eventos do seu Google Agenda aqui, junto com os seus compromissos.</p>${g.erro?`<p class="gc-p" style="color:var(--bad)">${g.erro}</p>`:''}<button class="btn dark sm" data-act="gconnect">Conectar Google Agenda</button>`;
  return `<div class="panel"><div class="panel-h"><h2>${ico('google')}Google Agenda</h2>${g.loading?'<span class="mono" style="color:var(--soft)">sincronizando…</span>':''}</div>${body}</div>`;
}
const GHELP='No computador, abra <b>calendar.google.com</b> → ⚙ Configurações → clique na sua agenda (em “Configurações das minhas agendas”) → desça até <b>Integrar agenda</b> → copie o <b>Endereço secreto no formato iCal</b>. Ele termina em <b>.ics</b>. Esse link é privado: não compartilhe.';
const ACT_EXTRA={
  newstopic:e=>{G.topic=e.dataset.v;loadNews(G.topic);render();return 'skip'},
  newsreload:e=>{loadNews(e.dataset.v||(ui.route==='inicio'?'destaques':ui.route==='conteudo'?'nutricao':G.topic),true);return 'skip'},
  gonutri:()=>{G.topic='nutricao';loadNews('nutricao');location.hash='noticias';return 'skip'},
  toidea:e=>{S.posts.push({id:uid(),title:e.dataset.t,platform:'Instagram',format:'Reels',status:'ideia',date:'',time:'',account:ui.ctAcc!=='all'?ui.ctAcc:'',reach:0,link:e.dataset.l,caption:'',hashtags:'',notes:''});toast('Ideia salva em Conteúdo → Ideias sem data')},
  pnew:()=>postForm(),pedit:e=>postForm(e.dataset.id),pnewday:e=>postForm(null,{date:e.dataset.d}),
  accnew:()=>accountForm(),accedit:e=>accountForm(e.dataset.id),
  ctsel:e=>{ui.ctSel=e.dataset.d;render();if(matchMedia('(max-width:900px)').matches)$('#daypanel')?.scrollIntoView({behavior:'smooth',block:'start'});return 'skip'},
  ctacc:e=>{ui.ctAcc=e.dataset.v;render();return 'skip'},ctm:e=>{ui.ctMonth+=+e.dataset.v;render();return 'skip'},ctview:e=>{ui.ctView=e.dataset.v;render();return 'skip'},
  gsync:()=>{loadGcal();return 'skip'},
  gconnect:()=>form('Conectar Google Agenda',[{id:'url',label:'Endereço secreto no formato iCal',required:true,placeholder:'https://calendar.google.com/calendar/ical/…/basic.ics',help:GHELP}],async d=>{
    const url=d.url.trim();
    if(!/^https:\/\//.test(url)){toast('O link precisa começar com https://');return}
    const {error}=await sb.from('recanto_config').upsert({user_id:cloud.uid,google_ical:url,atualizado_em:new Date().toISOString()});
    if(error){toast('Não deu para salvar o link');return}
    toast('Google Agenda conectado');loadGcal();
  },'Conectar'),
  gdisconnect:async()=>{const {error}=await sb.from('recanto_config').update({google_ical:null}).eq('user_id',cloud.uid);if(error){toast('Não deu para desconectar');return 'skip'}G.gcal={conectado:false,eventos:[],erro:'',at:null,loading:false};saveExtras();toast('Google Agenda desconectado');render();return 'skip'}
};

/* ================= navegação ================= */
const NAV=[['inicio','Início','home'],['tarefas','Tarefas','tasks'],['habitos','Hábitos','habit'],['cerebro','Segundo cérebro','brain'],['noticias','Notícias','news'],['agenda','Agenda','cal'],['conteudo','Conteúdo','content']];
const QUOTES=['Um dia de cada vez.','Feito é melhor que perfeito.','Pequenos passos, todo dia.','Cuide do básico e o resto acompanha.'];
function renderNav(){
  const open=S.tasks.filter(t=>t.status!=='done'&&t.date<=T).length;
  $('#nav').innerHTML=`<div class="lbl mono">Sua central</div>`+NAV.map(([k,l,i])=>`<a href="#${k}" ${ui.route===k?'aria-current="page"':''}>${ico(i)}${l}${k==='tarefas'&&open?`<span class="badge">${open}</span>`:''}</a>`).join('');
}
function render(){
  normalize();
  const r=location.hash.slice(1);ui.route=V[r]?r:'inicio';
  renderNav();
  $('#main').innerHTML=V[ui.route]();
  if(ui.route==='tarefas')bindDrag();
  if(ui.route==='conteudo')bindPostDrag();
}
let lastRoute='';
window.addEventListener('hashchange',()=>{if(location.hash==='#noticias')loadNews(G.topic);if(location.hash==='#conteudo')loadNews('nutricao');render();if(ui.route!==lastRoute){window.scrollTo(0,0);lastRoute=ui.route;scrollToday()}});
function scrollToday(){if(ui.route==='tarefas'){const c=$('#todaycol'),w=$('#week');if(c&&w)w.scrollLeft=c.offsetLeft-w.offsetLeft-8}}

/* ================= ações ================= */
const find=(arr,id)=>S[arr].find(x=>x.id===id);
const ACT={
  rename:()=>form('Como quer ser chamada(o)?',[{id:'name',label:'Nome',required:true,value:S.name}],d=>S.name=d.name),
  qtask:()=>addTask(),qevent:()=>addEvent(),qnote:()=>noteForm(),
  slotadd:e=>addTask({date:e.dataset.d,slot:e.dataset.s}),
  ttoggle:e=>{const t=find('tasks',e.dataset.id);t.status=t.status==='done'?'todo':'done'},
  tstatus:e=>{const t=find('tasks',e.dataset.id);t.status={todo:'doing',doing:'done',done:'todo'}[t.status]},
  tdel:e=>{S.tasks=S.tasks.filter(t=>t.id!==e.dataset.id);toast('Tarefa excluída')},
  moveLate:()=>{lateTasks().forEach(t=>t.date=T);ui.week=0;toast('Movidas para hoje')},
  week:e=>{const v=+e.dataset.v;ui.week=v===0?0:ui.week+v},
  htoggle:e=>{const h=find('habits',e.dataset.id),k=e.dataset.d;if(h.log[k])delete h.log[k];else h.log[k]=true},
  hdel:e=>{S.habits=S.habits.filter(h=>h.id!==e.dataset.id)},addHabit:()=>addHabit(),
  npin:e=>{const n=find('notes',e.dataset.id);n.pinned=!n.pinned},
  nedit:e=>noteForm(find('notes',e.dataset.id)),
  ndel:e=>{S.notes=S.notes.filter(n=>n.id!==e.dataset.id);toast('Nota excluída')},
  ntag:e=>{ui.noteTag=ui.noteTag===e.dataset.t?'':e.dataset.t},
  calm:e=>{ui.calMonth+=+e.dataset.v},
  goday:e=>{ui.agSel=e.dataset.d;const d=parse(e.dataset.d);ui.agMonth=(d.getFullYear()-TODAY.getFullYear())*12+d.getMonth()-TODAY.getMonth();location.hash='agenda';return 'skip'},
  agm:e=>{ui.agMonth+=+e.dataset.v},agsel:e=>{ui.agSel=e.dataset.d},
  evday:e=>addEvent(e.dataset.d),
  evdel:e=>{S.events=S.events.filter(x=>x.id!==e.dataset.id)},
  addPost:()=>addPost(),
  pdel:e=>{S.posts=S.posts.filter(p=>p.id!==e.dataset.id)}
};
Object.assign(ACT,ACT_EXTRA);
const OPENS_FORM=new Set(['rename','qtask','qout','qin','qevent','qnote','slotadd','addHabit','nedit','evday','gconnect','pnew','pedit','pnewday','accnew','accedit']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!ACT[el.dataset.act])return;
  e.preventDefault();
  const sx=$('#week')?.scrollLeft;
  const r=ACT[el.dataset.act](el);
  if(r==='skip'||OPENS_FORM.has(el.dataset.act))return;
  save();render();
  if(sx!=null&&$('#week'))$('#week').scrollLeft=sx;
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='noteSearch'){ui.noteQ=e.target.value;$('#notesGrid').innerHTML=notesGrid()}});

function bindDrag(){
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',el.dataset.drag);ev.dataTransfer.effectAllowed='move'});
  });
  document.querySelectorAll('[data-drop]').forEach(sl=>{
    sl.addEventListener('dragover',ev=>{ev.preventDefault();sl.classList.add('over')});
    sl.addEventListener('dragleave',()=>sl.classList.remove('over'));
    sl.addEventListener('drop',ev=>{ev.preventDefault();const id=ev.dataTransfer.getData('text/plain');const t=find('tasks',id);if(!t)return;const[d,s]=sl.dataset.drop.split('|');t.date=d;t.slot=s;const sx=$('#week').scrollLeft;save();render();$('#week').scrollLeft=sx});
  });
}

/* tema */
(function(){
  let th=null;try{th=localStorage.getItem('recanto.theme')}catch(e){}
  if(th)document.documentElement.dataset.theme=th;
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('recanto.theme',nx)}catch(e){}
  };
})();
$('#quote').textContent=QUOTES[TODAY.getDate()%QUOTES.length];
render();lastRoute=ui.route;scrollToday();
/* app instalável */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').hidden=false});
window.addEventListener('appinstalled',()=>{installEvt=null;$('#installBtn').hidden=true;toast('Recanto instalado')});
$('#installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r.outcome!=='accepted')$('#installBtn').hidden=true};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
/* login */
$('#gForm').addEventListener('submit',e=>{e.preventDefault();authSubmit('in')});
$('#gUp').addEventListener('click',()=>authSubmit('up'));
if(!sb){showLogin('Não foi possível carregar o Supabase. Verifique a internet e recarregue a página.')}
else sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(uid&&uid!==cloud.uid){cloud.uid=uid;cloud.ready=false;$('#gate').hidden=true;cloud.load();loadNews('destaques');loadGcal();if(ui.route==='conteudo')loadNews('nutricao');if(ui.route==='noticias')loadNews(G.topic)}
  else if(!uid){if(cloud.chan){sb.removeChannel(cloud.chan);cloud.chan=null}cloud.uid=null;cloud.ready=false;cloud.versao=0;cloud.base=null;G.news={};G.newsAt={};G.gcal={conectado:null,eventos:[],erro:'',at:null,loading:false};try{localStorage.removeItem('recanto.extras')}catch(e){}showLogin();}
});

</script>
